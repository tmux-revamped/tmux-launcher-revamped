set -g default-terminal "tmux-256color"
set -g escape-time 300
set -g status 2
set -g status-interval 1
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[default] "
set -g status-left-length 20
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W "
set -g @revamped_screen_keys ""
set -g status-format[1] "#[align=centre]#{?#{@revamped_screen_keys},#[fg=#1e1e2e#,bg=#f9e2af#,bold] #{@revamped_screen_keys} ,}"
set -g default-command "bash --noprofile --rcfile '$SCREENS_REPO/screens/setup.sh'"
bind -n C-] command-prompt -p "" "set -g @revamped_screen_keys '%%'"
set-environment -g HOME /Users/Shared/demo/home
set-environment -g TZ UTC
set-environment -gu FZF_DEFAULT_OPTS
set-environment -gu FZF_DEFAULT_COMMAND
set -g @launcher_revamped_apps 'lazygit tig notes man dash'
set -g @launcher_revamped_marker '.git'
set -g @launcher_revamped_lazygit_key 'G'
set -g @launcher_revamped_tig_key 'T'
set -g @launcher_revamped_tig_mode 'window'
set -g @launcher_revamped_notes_key 'N'
set -g @launcher_revamped_notes_command 'less README.md'
set -g @launcher_revamped_notes_mode 'split'
set -g @launcher_revamped_man_key 'K'
set -g @launcher_revamped_man_prompt 'man:'
set -g @launcher_revamped_dash_key 'A'
set -g @launcher_revamped_dash_group 'lazygit notes'
set -g @launcher_revamped_picker_key 'P'
run-shell /Users/Shared/demo/tmux-launcher-revamped/launcher-revamped.tmux
